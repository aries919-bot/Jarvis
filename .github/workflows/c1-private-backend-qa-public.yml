name: C1 Private Backend QA (public runner)
# Public-runner QA refresh for private C1 HEAD 3f58123cfbb9d8ee420050337e57f708aa45fdf5; records exact checkout SHA, regression tests, live counts and local D1 smoke.

on:
  push:
    branches: [qa/c1-private-runner]
    paths:
      - '.github/workflows/c1-private-backend-qa-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c1-backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      C1_READ_TOKEN: ${{ secrets.JARVIS_CLOUD_READ_TOKEN || secrets.JARVIS_SOURCE_READ_TOKEN }}
    steps:
      - name: Check out QA workflow repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect private read credential without printing it
        id: credentials
        shell: bash
        run: |
          if [ -n "$C1_READ_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "A private-repository credential is configured."
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::error::No read-only credential is configured for aries919-bot/jarvis-cloud."
            exit 1
          fi

      - name: Check out private C1 backend source
        if: ${{ steps.credentials.outputs.has_token == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: aries919-bot/jarvis-cloud
          ref: is/c1-career-feed
          path: private-c1
          token: ${{ env.C1_READ_TOKEN }}
          persist-credentials: false

      - name: Record exact private C1 backend revision
        if: ${{ steps.credentials.outputs.has_token == 'true' }}
        working-directory: private-c1
        shell: bash
        run: |
          private_sha="$(git rev-parse HEAD)"
          private_branch="$(git branch --show-current)"
          echo "Private backend ref: ${private_branch}" >> "$GITHUB_STEP_SUMMARY"
          echo "Private backend SHA: ${private_sha}" >> "$GITHUB_STEP_SUMMARY"
          echo "PRIVATE_C1_SHA=${private_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Node 22
        if: ${{ steps.credentials.outputs.has_token == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run C1 backend regression suite
        if: ${{ steps.credentials.outputs.has_token == 'true' }}
        working-directory: private-c1
        run: npm run test:c1

      - name: Run live C1 source audit with full-text deadline parsing
        if: ${{ steps.credentials.outputs.has_token == 'true' }}
        working-directory: private-c1
        run: node scripts/career-feed-live.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Archive public C1 source-count report
        if: ${{ steps.credentials.outputs.has_token == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: c1-live-source-report
          path: |
            private-c1/career-feed-live.json
            private-c1/career-feed-live.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Run local Worker and D1 integration smoke (bounded process shutdown)
        if: ${{ steps.credentials.outputs.has_token == 'true' }}
        working-directory: private-c1
        run: node scripts/c1-worker-d1-smoke.mjs
