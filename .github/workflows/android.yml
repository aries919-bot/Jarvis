name: Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [ kariyer-modulu, is/kariyer-1-21-verified-search ]
  push:
    branches: [ main, master, film-dizi-v2, kariyer-modulu, aries-career-monitor, career-ui-dedup-separation, is/kamu-kariyer-arama-ayristirma, is/kadro-radari-ve-kpss-2026-2, is/kariyer-platform-derinlestirme, is/1-18-kariyer-guvenilirlik-ve-akilli-tarih, is/1-19-ilan-duyuru-ayrimi-sirket-arastirmasi, is/1-20-kariyer-ilan-dogrulama, is/1-20-tarih-ayristirma-duzeltmesi, is/c3-ilan-semasi-ai-kaynak-kaniti ]

permissions:
  contents: read

concurrency:
  # Keep only the newest verification for a branch; obsolete commits should not occupy runners.
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Repository maintenance tool tests
        run: python3 scripts/qa/test_repo_maintenance.py
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Imza dosyasi (opsiyonel)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aries.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/aries.jks" >> "$GITHUB_ENV"
          else
            echo "İmza anahtarı tanımlı değil; Android debug imzası kullanılacak."
          fi
      - name: Birim testleri
        run: gradle testDebugUnitTest --no-daemon
      - name: APK derle
        run: gradle assembleDebug --no-daemon
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
      - uses: actions/upload-artifact@v7
        with:
          name: aries-apk
          path: app/build/outputs/apk/debug/app-debug.apk
