name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, film-dizi-v2 ]
  pull_request:
    branches: [ film-dizi-v2 ]

concurrency:
  group: android-apk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Imza dosyasi (opsiyonel)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aries.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/aries.jks" >> "$GITHUB_ENV"
          else
            echo "İmza anahtarı tanımlı değil; Android debug imzası kullanılacak."
          fi
      - name: Birim testleri ve APK derle
        run: gradle testDebugUnitTest assembleDebug --no-daemon
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
      - name: APK dosyasını ve imzasını doğrula
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_DIR/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep "package: name='com.cem.jarvis' versionCode='11' versionName='1.10'"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: aries-apk
          path: app/build/outputs/apk/debug/app-debug.apk
