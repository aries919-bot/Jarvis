name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, film-dizi-v2, kariyer-modulu, aries-career-monitor, career-ui-dedup-separation, is/kamu-kariyer-arama-ayristirma ]

concurrency:
  # Isolate each commit so a stale runner for an earlier push cannot block the latest verification.
  group: android-apk-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Imza dosyasi (opsiyonel)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aries.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/aries.jks" >> "$GITHUB_ENV"
          else
            echo "İmza anahtarı tanımlı değil; Android debug imzası kullanılacak."
          fi
      - name: Birim testleri
        run: gradle testDebugUnitTest --no-daemon
      - name: APK derle
        run: gradle assembleDebug --no-daemon
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: aries-apk
          path: app/build/outputs/apk/debug/app-debug.apk
