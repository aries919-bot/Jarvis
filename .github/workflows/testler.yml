name: Python Script Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: scripts altindaki tum testleri calistir ve ozetle
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s scripts -p 'test_*.py' -v > /tmp/scripts-tests.log 2>&1
          test_status=$?
          set -e
          cat /tmp/scripts-tests.log
          TEST_STATUS="$test_status" python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          log = Path('/tmp/scripts-tests.log').read_text(encoding='utf-8', errors='replace')
          match = re.search(r'^Ran (\d+) tests? in ', log, re.MULTILINE)
          total = int(match.group(1)) if match else 0
          failed_match = re.search(r'FAILED \\((.*?)\\)', log)
          failed = 0
          if failed_match:
              for key, value in re.findall(r'(failures|errors)=(\d+)', failed_match.group(1)):
                  failed += int(value)
          status = int(os.environ['TEST_STATUS'])
          passed = max(0, total - failed)
          result = 'BAŞARILI' if status == 0 and total > 0 else 'BAŞARISIZ'
          lines = [
              '## scripts/ test sonucu',
              '',
              f'- Toplam test: **{total}**',
              f'- Geçen test: **{passed}**',
              f'- Başarısız test: **{failed}**',
              f'- Komut çıkış kodu: **{status}**',
              f'- Sonuç: **{result}**',
              '',
              "Çalıştırılan komut: `python3 -m unittest discover -s scripts -p 'test_*.py' -v`",
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          if status != 0 or total == 0:
              raise SystemExit(1)
          PY
