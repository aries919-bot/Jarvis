name: C1 Private Backend QA on Public Runner

on:
  push:
    branches: [qa/c1-private-runner]
    paths:
      - '.github/workflows/c1-private-backend-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c1-backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      C1_READ_TOKEN: ${{ secrets.JARVIS_CLOUD_READ_TOKEN || secrets.JARVIS_SOURCE_READ_TOKEN }}
    steps:
      - name: Checkout QA workflow repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check private-repository read credential without exposing it
        if: ${{ env.C1_READ_TOKEN == '' }}
        run: |
          echo "::error::No read-only credential is configured in this repository for aries919-bot/jarvis-cloud."
          echo "No credential value was requested or printed."
          exit 1

      - name: Checkout private C1 backend source
        if: ${{ env.C1_READ_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          repository: aries919-bot/jarvis-cloud
          ref: is/c1-career-feed
          path: private-c1
          token: ${{ env.C1_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Node 22
        if: ${{ env.C1_READ_TOKEN != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run C1 backend regression suite
        if: ${{ env.C1_READ_TOKEN != '' }}
        working-directory: private-c1
        run: npm run test:c1
