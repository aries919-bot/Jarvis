name: APK Verification

on:
  workflow_dispatch:
  push:
    branches: [ seekee-media-discovery ]

permissions:
  contents: read

concurrency:
  group: apk-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests and compile APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aries-apk-verified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
