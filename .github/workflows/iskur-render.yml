name: ISKUR Render Yoklama

# K1: ISKUR "kurum disi kamu isci alim ilanlari" sayfasi tarayiciyla render edilir.
# - scripts/render_probe.py once robots.txt'e bakar; sayfa yolu kapaliysa tarayici acmaz.
# - Sayfa TEK kez acilir; tiklama / giris / form doldurma yapilmaz.
# - Anahtar/token kullanilmaz.
on:
  workflow_dispatch:
  push:
    branches: [cline/K1]
    paths:
      - ".github/workflows/iskur-render.yml"

permissions:
  contents: read

concurrency:
  group: iskur-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Playwright + chromium kur
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright
          python3 -m playwright install chromium --with-deps

      - name: Render yoklamasi (robots once, tek sayfa acilisi)
        run: |
          set -o pipefail
          python3 scripts/render_probe.py \
            --url https://iskur.gov.tr/ilanlar/kurumdisi-kamu-isci-alim-ilanlari/ \
            --out render_ciktisi.html | tee render_probe.txt

      - name: Sonucu is ozetine yaz
        if: always()
        run: |
          {
            echo "## ISKUR render yoklamasi"
            echo
            echo "- Is: ${{ github.workflow }} (ref: ${{ github.ref_name }})"
            echo "- Betik tek sayfa acar; tiklama/giris/form yok."
            echo
            echo '```'
            sed -n '1,220p' render_probe.txt 2>/dev/null || echo "cikti dosyasi yok"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iskur-render
          path: |
            render_ciktisi.html
            render_probe.txt
          if-no-files-found: warn
          retention-days: 14
