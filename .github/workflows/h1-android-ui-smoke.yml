name: H1 Android UI Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [ kariyer-modulu ]
    paths:
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/java/com/cem/jarvis/CareerActivity.kt"
      - "app/src/main/java/com/cem/jarvis/CareerNewsVerification*.kt"
      - "app/src/androidTest/**"
      - ".github/workflows/h1-android-ui-smoke.yml"

permissions:
  contents: read

concurrency:
  group: h1-android-ui-smoke-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  h1-emulator-smoke:
    name: H1 Activity + SQLite on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR integration merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify PR head and tested base
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_POLICY_SHA: 09f98b324a9a1f38dbbc25853ec2eba2fc544db9
        run: |
          set -euo pipefail
          TESTED_SHA="$(git rev-parse HEAD)"
          BASE_PARENT="$(git rev-parse HEAD^1)"
          HEAD_PARENT="$(git rev-parse HEAD^2)"
          echo "PR head: $PR_HEAD_SHA"
          echo "PR base: $PR_BASE_SHA"
          echo "Tested merge ref: $TESTED_SHA"
          echo "Merge base parent: $BASE_PARENT"
          echo "Merge head parent: $HEAD_PARENT"
          test "$HEAD_PARENT" = "$PR_HEAD_SHA"
          test "$BASE_PARENT" = "$PR_BASE_SHA"
          test "$BASE_PARENT" = "$REQUIRED_POLICY_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Inspect AndroidX tracing dependency resolution
        run: |
          set -euo pipefail
          gradle :app:dependencyInsight --configuration debugRuntimeClasspath --dependency androidx.tracing:tracing --no-daemon --console=plain
          gradle :app:dependencyInsight --configuration debugAndroidTestRuntimeClasspath --dependency androidx.test:monitor --no-daemon --console=plain

      - name: Run Android emulator instrumentation tests
        timeout-minutes: 30
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -o pipefail
            gradle connectedDebugAndroidTest --no-daemon --stacktrace --console=plain 2>&1 | tee h1-emulator.log

      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-android-emulator-reports
          path: |
            h1-emulator.log
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/outputs/apk/androidTest/debug/
          if-no-files-found: ignore
