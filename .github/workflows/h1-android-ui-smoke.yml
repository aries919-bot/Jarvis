name: H1 Android UI Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [ kariyer-modulu ]
    paths:
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/java/com/cem/jarvis/CareerActivity.kt"
      - "app/src/main/java/com/cem/jarvis/CareerNewsVerification*.kt"
      - "app/src/androidTest/**"
      - ".github/workflows/h1-android-ui-smoke.yml"

permissions:
  contents: read

concurrency:
  group: h1-android-ui-smoke-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  h1-emulator-smoke:
    name: H1 Activity + SQLite on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-android-emulator-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/outputs/apk/androidTest/debug/
          if-no-files-found: ignore
