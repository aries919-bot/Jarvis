name: PR Hakem (deterministik + Cloudflare Workers AI)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - is/K1-test-workflow
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: hakem-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hakem:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test suite
        id: tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/hakem-tests.log"

      - name: Deterministic checks and Cloudflare AI review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          EVENT_PATH: ${{ github.event_path }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python scripts/hakem_gate.py \
            --test-log "$RUNNER_TEMP/hakem-tests.log" \
            --event "$EVENT_PATH" \
            --event-name "$EVENT_NAME" \
            --repository "$REPOSITORY" \
            --ref-name "$REF_NAME"
