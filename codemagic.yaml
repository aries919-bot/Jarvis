workflows:
  aries-121-android:
    name: Aries 1.21 — Android build, lint and unit tests
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      vars:
        JAVA_HOME: /usr/lib/jvm/java-1.17.0-openjdk-amd64
        ANDROID_SDK_ROOT: /usr/local/share/android-sdk

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: is/kariyer-1-21-verified-search
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Verify the pinned Android build toolchain
        script: |
          set -euo pipefail
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x /home/builder/programs/gradle-8.11.1/bin/gradle
          "$JAVA_HOME/bin/java" -version
          /home/builder/programs/gradle-8.11.1/bin/gradle --version
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -F "platforms;android-34"

      - name: Configure Android SDK
        script: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Run Android unit tests
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          /home/builder/programs/gradle-8.11.1/bin/gradle testDebugUnitTest --no-daemon

      - name: Run Android Lint
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          /home/builder/programs/gradle-8.11.1/bin/gradle lintDebug --no-daemon

      - name: Build installable debug APK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          /home/builder/programs/gradle-8.11.1/bin/gradle assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/reports/tests/testDebugUnitTest/**/*
      - app/build/test-results/testDebugUnitTest/**/*
      - app/build/reports/lint-results-debug.html
      - app/build/outputs/mapping/debug/**/*
